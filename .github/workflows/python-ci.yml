name: Python CI Workflows

on: 
    push: 
        branches:
            - master
    
    pull_request:
        branches:
            - master

jobs:

    test:
        # runs-on: ubuntu-latest
        # runs-on: windows-latest
        # runs-on: self-hosted
        runs-on: [self-hosted, windows, x64]

        steps: 

            - name: Checkout Code
              uses: actions/checkout@v4

            # - name: Set up Python 3.11
            #   uses: actions/setup-python@v5
            #   with: 
            #     python-version: "3.11"

            # - name: Check Python
            #   run: |
            #     python --version
            #     where python

            # - name: Install dependencies
            #   run: | 
            #     python -m pip install --upgrade pip
            #     pip install -r requirements.txt

            # - name: Run tests
            #   run: pytest
            
            # - name: Check PLC OPC UA Connection
            #   run: |
            #     python plc/plc_check.py

               
            - name: Check Python
              shell: powershell
              run: |
                & "C:\Users\LENOVO\AppData\Local\Programs\Python\Python311\python.exe" --version
                & "C:\Users\LENOVO\AppData\Local\Programs\Python\Python311\python.exe" -c "import sys; print(sys.executable)"

            - name: Create CI Virtual Environment
              shell: powershell
              run: |
                & "C:\Users\LENOVO\AppData\Local\Programs\Python\Python311\python.exe" -m venv .ci-venv

            - name: Install dependencies
              shell: powershell
              run: |
                & ".\.ci-venv\Scripts\python.exe" -m pip install --upgrade pip
                & ".\.ci-venv\Scripts\python.exe" -m pip install -r requirements.txt

            - name: Run tests
              shell: powershell
              run: |
                & ".\.ci-venv\Scripts\python.exe" -m pytest

            - name: Check PLC OPC UA Connection
              shell: powershell
              run: |
                & ".\.ci-venv\Scripts\python.exe" plc\plc_check.py

                